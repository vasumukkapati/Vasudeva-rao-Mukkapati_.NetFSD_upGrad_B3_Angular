<!DOCTYPE html>
<html>
<head>
    <title>Personal Profile Card</title>

    <style>

        /* Page Styling */
        body {
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Card */
        .card {
            background-color: white;
            width: 300px;
            padding: 25px;              /* Padding (inside space) */
            border: 1px solid #ddd;     /* Border */
            border-radius: 10px;        /* Rounded corners */
            margin: 20px;               /* Margin (outside space) */
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Name */
        .card h2 {
            margin-bottom: 10px;
            font-size: 22px;
            font-weight: bold;
            color: #1e3a8a;
        }

        /* Role */
        .role {
            font-size: 14px;
            color: #555;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        /* Description */
        .description {
            font-size: 14px;
            line-height: 1.6;
            color: #444;
            margin-bottom: 20px;
        }

        /* Button */
        .btn {
            text-decoration: none;
            background-color: #3b82f6;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            display: inline-block;
            transition: 0.3s;
        }

        /* Hover Effect */
        .btn:hover {
            background-color: #1e3a8a;
        }

    </style>
</head>

<body>

    <div class="card">
        <h2>Vasu Mukkapati</h2>
        <p class="role">Web Developer</p>
        <p class="description">
            Passionate about building responsive and user-friendly websites 
            using HTML and CSS.
        </p>
        <a href="#" class="btn">Contact Me</a>
    </div>

</body>
</html>
