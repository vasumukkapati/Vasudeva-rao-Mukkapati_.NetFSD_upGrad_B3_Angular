<!DOCTYPE html>
<html>
<head>
    <title>Responsive Dashboard</title>

    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Layout */
        body {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            background-color: #1e3a8a;
            color: white;
            padding: 20px;
        }

        .sidebar h2 {
            margin-bottom: 20px;
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar ul li {
            margin: 15px 0;
        }

        .sidebar ul li a {
            text-decoration: none;
            color: white;
        }

        .sidebar ul li a:hover {
            text-decoration: underline;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 20px;
            background-color: #f4f6f9;
        }

        .main-content h1 {
            margin-bottom: 20px;
        }

        /* Cards */
        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card {
            flex: 1 1 250px;
            background-color: white;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            transition: 0.3s;
        }

        .card h3 {
            margin-bottom: 10px;
            color: #1e3a8a;
        }

        .card p {
            color: #555;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Responsive */
        @media (max-width: 768px) {

            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                text-align: center;
            }

            .sidebar ul {
                display: flex;
                justify-content: space-around;
            }

            .cards {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Dashboard</h2>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Users</a></li>
            <li><a href="#">Reports</a></li>
            <li><a href="#">Settings</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <h1>Admin Panel</h1>

        <div class="cards">

            <div class="card">
                <h3>Total Users</h3>
                <p>1,250 Active Users</p>
            </div>

            <div class="card">
                <h3>Revenue</h3>
                <p>$12,500 This Month</p>
            </div>

            <div class="card">
                <h3>New Orders</h3>
                <p>320 Orders Received</p>
            </div>

            <div class="card">
                <h3>Support Tickets</h3>
                <p>45 Pending Tickets</p>
            </div>

        </div>
    </div>

</body>
</html>
