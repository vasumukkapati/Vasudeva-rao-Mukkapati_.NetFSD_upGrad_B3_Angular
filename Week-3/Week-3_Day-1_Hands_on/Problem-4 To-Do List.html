<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive To-Do List</title>

   

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input {
            width: 70%;
            padding: 8px;
        }

        #addTask {
            padding: 8px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 15px;
        }

        li {
            padding: 8px;
            margin-top: 8px;
            background: #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        button {
            margin-left: 5px;
            cursor: pointer;
        }

        .counts {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">
    <h3>To-Do List</h3>

    <input type="text" id="taskInput" placeholder="Enter task">
    <button id="addTask">Add</button>

    <ul id="taskList"></ul>

    <div class="counts">
        Total Tasks: <span id="totalCount">0</span> |
        Completed: <span id="completedCount">0</span>
    </div>
</div>
 <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>

<script>
$(document).ready(function () {

    let total = 0;
    let completed = 0;

    // Add Task
    $("#addTask").click(function () {

        let taskText = $("#taskInput").val().trim();

        if (taskText !== "") {

            let newTask = `
                <li>
                    <span class="task-text">${taskText}</span>
                    <div>
                        <button class="complete-btn">Complete</button>
                        <button class="delete-btn">Delete</button>
                    </div>
                </li>
            `;

            $("#taskList").append(newTask);

            total++;
            $("#totalCount").text(total);

            $("#taskInput").val("");
        }
    });

    // Mark as Completed (Event Delegation)
    $("#taskList").on("click", ".complete-btn", function () {

        let taskItem = $(this).closest("li");
        let taskText = taskItem.find(".task-text");

        taskText.toggleClass("completed");

        if (taskText.hasClass("completed")) {
            completed++;
        } else {
            completed--;
        }

        $("#completedCount").text(completed);
    });

    // Delete Task (Event Delegation)
    $("#taskList").on("click", ".delete-btn", function () {

        let taskItem = $(this).closest("li");
        let taskText = taskItem.find(".task-text");

        // If deleting a completed task, reduce completed count
        if (taskText.hasClass("completed")) {
            completed--;
            $("#completedCount").text(completed);
        }

        total--;
        $("#totalCount").text(total);

        taskItem.remove();
    });

});
</script>

</body>
</html>
