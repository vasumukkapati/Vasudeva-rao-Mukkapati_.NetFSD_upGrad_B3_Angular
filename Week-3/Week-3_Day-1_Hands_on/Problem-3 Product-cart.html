<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product List with Cart Counter</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body class="bg-light">

<!-- Navbar with Cart Counter -->
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand">My Shop</span>
        <span class="text-white">
            Cart: <span id="cartCount" class="badge bg-warning text-dark">0</span>
        </span>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">

        <!-- Product 1 -->
        <div class="col-md-3">
            <div class="card mb-4">
                <div class="card-body text-center">
                    <h5 class="card-title">Laptop</h5>
                    <p>₹59999</p>
                    <button class="btn btn-success add-to-cart">Add to Cart</button>
                    <small class="text-success d-block mt-2 message"></small>
                </div>
            </div>
        </div>

        <!-- Product 2 -->
        <div class="col-md-3">
            <div class="card mb-4">
                <div class="card-body text-center">
                    <h5 class="card-title">Mobile</h5>
                    <p>₹1499</p>
                    <button class="btn btn-success add-to-cart">Add to Cart</button>
                    <small class="text-success d-block mt-2 message"></small>
                </div>
            </div>
        </div>

        <!-- Product 3 -->
        <div class="col-md-3">
            <div class="card mb-4">
                <div class="card-body text-center">
                    <h5 class="card-title">Headphones</h5>
                    <p>₹4999</p>
                    <button class="btn btn-success add-to-cart">Add to Cart</button>
                    <small class="text-success d-block mt-2 message"></small>
                </div>
            </div>
        </div>

        <!-- Product 4 -->
        <div class="col-md-3">
            <div class="card mb-4">
                <div class="card-body text-center">
                    <h5 class="card-title">Watch</h5>
                    <p>₹1499</p>
                    <button class="btn btn-success add-to-cart">Add to Cart</button>
                    <small class="text-success d-block mt-2 message"></small>
                </div>
            </div>
        </div>

    </div>
</div>
<!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
<script>
$(document).ready(function () {

    let count = 0;

    $(".add-to-cart").click(function () {

        // Increase counter
        count++;
        $("#cartCount").text(count);

        // Disable button
        $(this).prop("disabled", true);

        // Change button text
        $(this).text("Added");

        // Add attribute (example usage of attr)
        $(this).attr("data-added", "true");

        // Show confirmation message
        $(this).siblings(".message").text("Item added successfully!");

    });

});
</script>

</body>
</html>
