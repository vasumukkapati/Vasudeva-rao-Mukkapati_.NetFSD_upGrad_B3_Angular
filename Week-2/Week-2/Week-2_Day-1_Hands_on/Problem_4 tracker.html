<!DOCTYPE html>
<html>
<head>
    <title>Mini Expense Tracker</title>
</head>

<body>

<h2>Mini Expense Tracker</h2>

<label>Expense Title:</label>
<input type="text" id="title"><br><br>

<label>Amount:</label>
<input type="number" id="amount"><br><br>

<label>Date:</label>
<input type="date" id="date"><br><br>

<button onclick="addExpense()">Add Expense</button>
<button onclick="viewExpenses()">View Expenses</button>
<button onclick="deleteAll()">Delete All</button>

<h3>Expense List</h3>

<table border="1" width="100%">
    <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Amount</th>
            <th>Date</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="expenseBody"></tbody>
</table>

<script>

/* =========================
   Add Expense
========================= */
function addExpense() {

    let title = document.getElementById("title").value;
    let amount = document.getElementById("amount").value;
    let date = document.getElementById("date").value;

    if (!title || !amount || !date) {
        alert("All fields required");
        return;
    }

    let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

    expenses.push({
        title: title,
        amount: amount,
        date: date
    });

    localStorage.setItem("expenses", JSON.stringify(expenses));

    clearFields();
    viewExpenses();   // Immediately show in table
}


/* =========================
   View Expenses
========================= */
function viewExpenses() {

    let body = document.getElementById("expenseBody");
    body.innerHTML = "";

    let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

    expenses.forEach(function(expense, index) {

        let row = document.createElement("tr");

        row.innerHTML =
            "<td>" + (index + 1) + "</td>" +   // ID starts from 1
            "<td>" + expense.title + "</td>" +
            "<td>" + expense.amount + "</td>" +
            "<td>" + expense.date + "</td>" +
            "<td><button onclick='deleteExpense(" + index + ")'>Delete</button></td>";

        body.appendChild(row);
    });
}


/* =========================
   Delete Single Expense
========================= */
function deleteExpense(index) {

    let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

    expenses.splice(index, 1);

    localStorage.setItem("expenses", JSON.stringify(expenses));

    viewExpenses();
}


/* =========================
   Delete All
========================= */
function deleteAll() {

    localStorage.removeItem("expenses");

    viewExpenses();
}


/* =========================
   Clear Input Fields
========================= */
function clearFields() {
    document.getElementById("title").value = "";
    document.getElementById("amount").value = "";
    document.getElementById("date").value = "";
}


/* Load data on page open */
window.onload = viewExpenses;

</script>

</body>
</html>
