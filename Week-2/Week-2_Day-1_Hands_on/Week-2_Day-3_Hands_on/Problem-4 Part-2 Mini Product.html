<!DOCTYPE html>
<html>
<head>
    <title>Mini Product Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            margin-top: 60px;
        }

        .container {
            background: white;
            padding: 25px;
            width: 420px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 8px;
            margin-bottom: 6px;
            background: #eef1f5;
            border-radius: 4px;
            cursor: pointer;
        }

        .selected {
            background: #c8e6c9;
        }

        .no-result {
            text-align: center;
            color: crimson;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Mini Product Search</h2>
    <input type="text" id="searchInput" placeholder="Search products...">
    <ul id="productList"></ul>
</div>

<script>

/* -------- STATE -------- */
const products = [
    "Laptop",
    "Smartphone",
    "Headphones",
    "Keyboard",
    "Mouse",
    "Monitor",
    "Tablet",
    "Charger",
    "Speaker",
    "Camera"
];

// Store selected products
let selectedProducts = new Set();

/* -------- DOM REFERENCES -------- */
const searchInput = document.getElementById("searchInput");
const productList = document.getElementById("productList");

/* -------- RENDER FUNCTION -------- */
function renderProducts(productArray) {

    productList.innerHTML = "";

    if (productArray.length === 0) {
        productList.innerHTML = "<li class='no-result'>No Results Found</li>";
        return;
    }

    productArray.forEach(product => {
        const li = document.createElement("li");
        li.textContent = product;

        // Reapply selected state
        if (selectedProducts.has(product)) {
            li.classList.add("selected");
        }

        productList.appendChild(li);
    });
}

/* -------- FILTER FUNCTION -------- */
function filterProducts() {

    const searchValue = searchInput.value.toLowerCase();

    const filtered = products.filter(product =>
        product.toLowerCase().includes(searchValue)
    );

    renderProducts(filtered);
}

/* -------- INPUT EVENT -------- */
searchInput.addEventListener("input", filterProducts);

/* -------- EVENT DELEGATION FOR SELECTION -------- */
productList.addEventListener("click", function(event) {

    if (event.target.tagName === "LI" &&
        !event.target.classList.contains("no-result")) {

        const productName = event.target.textContent;

        // Toggle in state
        if (selectedProducts.has(productName)) {
            selectedProducts.delete(productName);
        } else {
            selectedProducts.add(productName);
        }

        event.target.classList.toggle("selected");
    }
});

/* -------- INITIAL RENDER -------- */
renderProducts(products);

</script>

</body>
</html>
