<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Analyzer</title>
</head>
<body>

<h2>Student Marks Analyzer</h2>
<button id="analyzeBtn">Analyze Marks</button>

<div id="output"></div>

<script>

const marks = [75, 82, 48, 90, 67];

// Calculate total using reduce()
const calculateTotal = (arr) =>
    arr.reduce((sum, mark) => sum + mark, 0);

// Calculate average
const calculateAverage = (arr) => {
    const total = calculateTotal(arr);
    return total / arr.length;
};

// Determine pass/fail
const getResult = (average) =>
    average >= 50 ? "PASS" : "FAIL";

document.getElementById("analyzeBtn").addEventListener("click", () => {

    // Display marks vertically using map()
    const marksList = marks
        .map((mark, index) => "Marks " + (index + 1) + ": " + mark)
        .join("<br>");

    const total = calculateTotal(marks);
    const average = calculateAverage(marks);
    const result = getResult(average);

    document.getElementById("output").innerHTML =
        "<p>" + marksList + "</p>" +
        "<p><strong>Total Marks:</strong> " + total + "</p>" +
        "<p><strong>Average Marks:</strong> " + average.toFixed(2) + "</p>" +
        "<p><strong>Result:</strong> " + result + "</p>";
});

</script>

</body>
</html>
