<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Listing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- ================= HEADER ================= -->
<div class="container py-4">
    <h2 class="text-center mb-4">Electronics Store</h2>

    <!-- ================= PRODUCT GRID ================= -->
    <div class="row g-4">

        <!-- Product 1 -->
        <div class="col-12 col-md-6 col-lg-3">
            <div class="card h-100 shadow-sm">
                <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">Smartphone</h5>
                    <p class="card-text">Android smartphone with high performance.</p>
                    <p class="fw-bold text-primary">₹12,999</p>

                    <div class="mt-auto">
                        <button class="btn btn-success btn-sm w-100 mb-2">Add to Cart</button>
                        <button class="btn btn-outline-primary btn-sm w-100">View Details</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Product 2 -->
        <div class="col-12 col-md-6 col-lg-3">
            <div class="card h-100 shadow-sm">
                <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">Laptop</h5>
                    <p class="card-text"> Fast laptop for coding and gaming.</p>
                    <p class="fw-bold text-primary">₹59,000</p>

                    <div class="mt-auto">
                        <button class="btn btn-success btn-sm w-100 mb-2">Add to Cart</button>
                        <button class="btn btn-outline-primary btn-sm w-100">View Details</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Product 3 -->
        <div class="col-12 col-md-6 col-lg-3">
            <div class="card h-100 shadow-sm">
                <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">Headphones</h5>
                    <p class="card-text">Noise cancelling wireless headphones.</p>
                    <p class="fw-bold text-primary">₹2,999</p>

                    <div class="mt-auto">
                        <button class="btn btn-success btn-sm w-100 mb-2">Add to Cart</button>
                        <button class="btn btn-outline-primary btn-sm w-100">View Details</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Product 4 -->
        <div class="col-12 col-md-6 col-lg-3">
            <div class="card h-100 shadow-sm">
                <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">Smart Watch</h5>
                    <p class="card-text">Exercise tracking smart watch.</p>
                    <p class="fw-bold text-primary">₹4,999</p>

                    <div class="mt-auto">
                        <button class="btn btn-success btn-sm w-100 mb-2">Add to Cart</button>
                        <button class="btn btn-outline-primary btn-sm w-100">View Details</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
